spring:
  application:
    name: jerry-blossom-backend
  config:
    # `backend`와 프로젝트 루트 어느 위치에서 실행해도 루트의 .env를 읽는다.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5434}/${POSTGRES_DB:jerry_blossom}
    username: ${POSTGRES_USER:jerry}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # LAZY 연관관계 컬렉션/프록시를 순회할 때 조회를 IN 쿼리로 묶어 N+1을 완화한다.
        # 개별 목록 조회에는 fetch join 또는 DTO projection을 우선 적용한다.
        default_batch_fetch_size: 100
    servlet:
      multipart:
        # 이미지 업로드 크기 설정
        max-file-size: 5MB
        max-request-size: 5MB
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    cache-names: itemList, item, cart
    redis:
      time-to-live: 10m
server:
  port: 8080

springdoc:
  swagger-ui:
    default-models-expand-depth: -1

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

app:
  auth:
    cookie-secure: ${COOKIE_SECURE:false}
  upload:
    directory: ${UPLOAD_DIR:backend/uploads}
